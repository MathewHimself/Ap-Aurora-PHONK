<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>АП Aurora PHONK — прототип</title>
<link rel="stylesheet" href="Stylesheets/style.css">
</head>
<body>
<div class="start" id="start">
  <button id="startBtn">Включить звук</button>
</div>

<div class="page">
<div class="device">
<header>
  <div class="corner">
    <span class="corner-title">ТЕМП <span id="bpmLabel">130</span></span>
    <div class="corner-row">
      <button class="step" data-step="bpm" data-dir="-1" aria-label="Медленнее">−</button>
      <label><span hidden>Темп</span><input id="bpm" type="range" min="80" max="180" value="130" aria-label="Темп"></label>
      <button class="step" data-step="bpm" data-dir="1" aria-label="Быстрее">+</button>
    </div>
  </div>
  <div class="brand">
    <h1 class="logo">ап/синт</h1>
    <div class="key">
      <button class="step" id="keyPrev" aria-label="Предыдущая тональность">‹</button>
      <span class="key-name" id="keyName" aria-live="polite">C# минор</span>
      <button class="step" id="keyNext" aria-label="Следующая тональность">›</button>
    </div>
  </div>
  <div class="corner right">
    <span class="corner-title">ГРОМКОСТЬ <span id="volLabel">80</span></span>
    <div class="corner-row">
      <button class="step" data-step="vol" data-dir="-1" aria-label="Тише">−</button>
      <label><span hidden>Громкость</span><input id="vol" type="range" min="0" max="100" value="80" aria-label="Громкость"></label>
      <button class="step" data-step="vol" data-dir="1" aria-label="Громче">+</button>
    </div>
  </div>
</header>

<div class="body">
  <div class="side">
    <section class="card bus-cow" data-fx="cowDist" aria-label="Дисторшн ковбелла">
      <div class="card-head"><span class="sw"></span><span class="card-title">ДИСТОРШН</span><button class="toggle" aria-pressed="true" aria-label="Включить дисторшн ковбелла"><span></span></button></div>
      <label class="ctrl"><span class="ctrl-row"><span>Микс</span><output></output></span><input type="range" data-p="cowDist.wet" value="60"></label>
      <label class="ctrl"><span class="ctrl-row"><span>Драйв</span><output></output></span><input type="range" data-p="cowDist.drive" value="40"></label>
      <div class="ctrl" role="group" aria-label="Оверсемплинг"><span class="seg-label">Оверсемплинг</span>
        <div class="seg" data-seg="cowDist.os"><button aria-pressed="false" data-v="none">Нет</button><button aria-pressed="true" data-v="2x">2x</button><button aria-pressed="false" data-v="4x">4x</button></div></div>
    </section>
    <section class="card bus-cow" data-fx="cowRev" aria-label="Ревёрб ковбелла">
      <div class="card-head"><span class="sw"></span><span class="card-title">РЕВЁРБ</span><button class="toggle" aria-pressed="true" aria-label="Включить ревёрб ковбелла"><span></span></button></div>
      <label class="ctrl"><span class="ctrl-row"><span>Микс</span><output></output></span><input type="range" data-p="cowRev.wet" value="35"></label>
      <label class="ctrl"><span class="ctrl-row"><span>Затухание</span><output></output></span><input type="range" data-p="cowRev.decay" value="35"></label>
      <label class="ctrl"><span class="ctrl-row"><span>Пре-дилей</span><output></output></span><input type="range" data-p="cowRev.pre" value="20"></label>
    </section>
    <section class="card bus-drums off" data-fx="crush" aria-label="Биткрашер ударных">
      <div class="card-head"><span class="sw"></span><span class="card-title">БИТКРАШЕР</span><button class="toggle" aria-pressed="false" aria-label="Включить биткрашер ударных"><span></span></button></div>
      <label class="ctrl"><span class="ctrl-row"><span>Микс</span><output></output></span><input type="range" data-p="crush.wet" value="60"></label>
      <label class="ctrl"><span class="ctrl-row"><span>Биты</span><output></output></span><input type="range" data-p="crush.bits" value="35"></label>
    </section>
    <section class="card bus-drums" data-fx="drumRev" aria-label="Ревёрб ударных">
      <div class="card-head"><span class="sw"></span><span class="card-title">РЕВЁРБ</span><button class="toggle" aria-pressed="true" aria-label="Включить ревёрб ударных"><span></span></button></div>
      <label class="ctrl"><span class="ctrl-row"><span>Микс</span><output></output></span><input type="range" data-p="drumRev.wet" value="15"></label>
      <label class="ctrl"><span class="ctrl-row"><span>Затухание</span><output></output></span><input type="range" data-p="drumRev.decay" value="15"></label>
    </section>
  </div>

  <div class="center">
    <figure class="visual" aria-label="Визуал реагирует на громкость">
      <svg class="aurora" id="aurora" viewBox="0 0 1500 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="bands" x1="0" y1="0" x2="1" y2="0.15">
            <stop offset="0" stop-color="#05070A"></stop><stop offset="0.18" stop-color="#0B1B5A"></stop>
            <stop offset="0.28" stop-color="#39FF14"></stop><stop offset="0.35" stop-color="#B6FF3B"></stop>
            <stop offset="0.43" stop-color="#2FE6E6"></stop><stop offset="0.52" stop-color="#5B2BFF"></stop>
            <stop offset="0.6" stop-color="#FF2BD6"></stop><stop offset="0.68" stop-color="#6A2BFF"></stop>
            <stop offset="0.77" stop-color="#39FF14"></stop><stop offset="0.86" stop-color="#2FE6E6"></stop>
            <stop offset="0.93" stop-color="#FF2BD6"></stop><stop offset="1" stop-color="#5B2BFF"></stop>
          </linearGradient>
          <filter id="melt" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.0035 0.011" numOctaves="2" seed="11" result="noise"></feTurbulence>
            <feDisplacementMap id="disp" in="SourceGraphic" in2="noise" scale="420" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
          </filter>
          <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#05070A" stop-opacity="1"></stop><stop offset="0.3" stop-color="#05070A" stop-opacity="0.85"></stop><stop offset="0.5" stop-color="#05070A" stop-opacity="0"></stop>
          </linearGradient>
        </defs>
        <rect width="1500" height="800" fill="#05070A"></rect>
        <rect id="bandsRect" x="-300" y="-300" width="2100" height="1400" fill="url(#bands)" filter="url(#melt)"></rect>
        <rect width="1500" height="800" fill="url(#fade)"></rect>
        <g id="stars" fill="#FFFFFF" opacity="0.55">
          <circle cx="90" cy="120" r="1.4"></circle><circle cx="210" cy="260" r="1"></circle><circle cx="140" cy="420" r="1.6"></circle><circle cx="330" cy="150" r="1"></circle>
          <circle cx="420" cy="380" r="1.3"></circle><circle cx="260" cy="560" r="1"></circle><circle cx="60" cy="640" r="1.2"></circle><circle cx="500" cy="90" r="1"></circle>
          <circle cx="380" cy="690" r="1.4"></circle><circle cx="560" cy="250" r="1"></circle>
        </g>
        <g id="curve">
          <path d="M600 210 C 470 300, 470 560, 620 650 S 900 760, 1060 700" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round" fill="none" opacity="0.8"></path>
          <path d="M130 720 C 420 560, 640 470, 790 330 S 1020 30, 1150 60 S 1360 420, 1500 780" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round"></path>
          <circle cx="130" cy="720" r="10" fill="#FFFFFF"></circle><circle cx="790" cy="330" r="9" fill="#FFFFFF"></circle><circle cx="1150" cy="60" r="9" fill="#FFFFFF"></circle>
        </g>
      </svg>
      <div class="visual-ui">
        <div class="visual-top">
          <div class="tempo"><b id="bpmBig">130</b><span>BPM</span></div>
          <div class="chips" role="group" aria-label="Слои визуала">
            <button class="chip" data-layer="bandsRect" aria-pressed="true">Аврора</button>
            <button class="chip" data-layer="curve" aria-pressed="true">Кривая</button>
            <button class="chip" data-layer="stars" aria-pressed="true">Звёзды</button>
          </div>
        </div>
        <div class="cow-block">
          <div class="card-head bus-cow"><span class="sw"></span><span class="card-title is-fixed">КОВБЕЛЛ</span><span class="card-sub is-light">минорная пентатоника</span></div>
          <div class="glass-grid glass bus-cow" id="cowPads"></div>
        </div>
      </div>
    </figure>

    <div class="pads-row">
      <section class="card drums-card bus-drums" aria-label="Пэды ударных">
        <div class="card-head"><span class="sw"></span><span class="card-title is-fixed">УДАРНЫЕ</span></div>
        <div class="grid grid-6" id="drumPads"></div>
      </section>
      <section class="card bass-card bus-808" aria-label="Пэды 808">
        <div class="card-head"><span class="sw"></span><span class="card-title is-fixed">808</span><span class="card-sub">бас</span></div>
        <div class="grid grid-4" id="bassPads"></div>
      </section>
    </div>
    <div class="legend">
      <span class="bus-cow"><i class="sw"></i>Ковбелл</span>
      <span class="bus-drums"><i class="sw"></i>Ударные</span>
      <span class="bus-808"><i class="sw"></i>808</span>
      <span class="bus-master"><i class="sw"></i>Мастер</span>
    </div>
    <p class="hint">Играй мышкой или с клавиатуры: буквы в углу пэдов.</p>
  </div>

  <div class="side">
    <section class="card bus-808" data-fx="bassDist" aria-label="Дисторшн 808">
      <div class="card-head"><span class="sw"></span><span class="card-title">ДИСТОРШН</span><button class="toggle" aria-pressed="true" aria-label="Включить дисторшн 808"><span></span></button></div>
      <label class="ctrl"><span class="ctrl-row"><span>Микс</span><output></output></span><input type="range" data-p="bassDist.wet" value="70"></label>
      <label class="ctrl"><span class="ctrl-row"><span>Драйв</span><output></output></span><input type="range" data-p="bassDist.drive" value="55"></label>
      <div class="ctrl" role="group" aria-label="Оверсемплинг"><span class="seg-label">Оверсемплинг</span>
        <div class="seg" data-seg="bassDist.os"><button aria-pressed="false" data-v="none">Нет</button><button aria-pressed="false" data-v="2x">2x</button><button aria-pressed="true" data-v="4x">4x</button></div></div>
    </section>
    <section class="card bus-808" data-fx="bassFilter" aria-label="Фильтр 808">
      <div class="card-head"><span class="sw"></span><span class="card-title">ФИЛЬТР</span><button class="toggle" aria-pressed="true" aria-label="Включить фильтр 808"><span></span></button></div>
      <label class="ctrl"><span class="ctrl-row"><span>Срез</span><output></output></span><input type="range" data-p="bassFilter.cutoff" value="65"></label>
      <label class="ctrl"><span class="ctrl-row"><span>Глайд</span><output></output></span><input type="range" data-p="bassFilter.glide" value="40"></label>
      <div class="ctrl" role="group" aria-label="Тип фильтра"><span class="seg-label">Тип</span>
        <div class="seg" data-seg="bassFilter.type"><button aria-pressed="true" data-v="lowpass">НЧ</button><button aria-pressed="false" data-v="highpass">ВЧ</button><button aria-pressed="false" data-v="bandpass">ПФ</button></div></div>
    </section>
    <section class="card bus-master" data-fx="comp" aria-label="Компрессор мастера">
      <div class="card-head"><span class="sw"></span><span class="card-title">КОМПРЕССОР</span><button class="toggle" aria-pressed="true" aria-label="Включить компрессор"><span></span></button></div>
      <label class="ctrl"><span class="ctrl-row"><span>Порог</span><output></output></span><input type="range" data-p="comp.threshold" value="55"></label>
      <label class="ctrl"><span class="ctrl-row"><span>Соотношение</span><output></output></span><input type="range" data-p="comp.ratio" value="16"></label>
    </section>
    <section class="card bus-master" data-fx="limiter" aria-label="Лимитер мастера">
      <div class="card-head"><span class="sw"></span><span class="card-title">ЛИМИТЕР</span><button class="toggle" aria-pressed="true" aria-label="Включить лимитер"><span></span></button></div>
      <label class="ctrl"><span class="ctrl-row"><span>Потолок</span><output></output></span><input type="range" data-p="limiter.ceiling" value="97"></label>
    </section>
  </div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
<script src="Javascripts/scripts.js"></script>
</body>
</html>
