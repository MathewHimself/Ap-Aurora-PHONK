<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>АП Aurora PHONK — прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000000;
  --panel: #0B0D10;
  --card: #101317;
  --line: #1E2228;
  --control: #1A1E24;
  --control-line: #2A2F37;
  --text: #FFFFFF;
  --text-2: #D7DAE0;
  --text-3: #9AA0AA;
  --cream: #F1E6C8;
  --ink: #0B0D10;
  --cow: #B6FF3B;
  --b808: #FF2BD6;
  --drums: #2FE6E6;
  --master: #8F6BFF;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #000000; --panel: #0B0D10; }
}
:root[data-theme="dark"] { --bg: #000000; --panel: #0B0D10; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Onest', 'Helvetica Neue', Arial, sans-serif; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--cow); outline-offset: 2px; }

.page { padding: 32px 20px; }
.device { max-width: 1360px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 24px; }

/* header */
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 24px; }
.corner { display: flex; flex-direction: column; gap: 10px; width: 260px; max-width: 100%; }
.corner.right { align-items: flex-end; }
.corner-title { font-size: 13px; font-weight: 700; letter-spacing: 0.05em; }
.corner-row { display: flex; align-items: center; gap: 10px; width: 100%; }
.corner-row label { flex: 1; min-width: 0; }
.step { width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; border: 1px solid #262B33; background: #16191E; color: var(--text); font-size: 18px; line-height: 1; }
.step:hover { background: #20242B; }
.brand { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.logo { margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; background: linear-gradient(90deg, var(--cow), var(--drums) 35%, var(--master) 65%, var(--b808)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.key { display: flex; align-items: center; gap: 10px; }
.key-name { min-width: 96px; text-align: center; font-size: 14px; font-weight: 600; }

/* layout */
.body { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.side { flex: 1 1 220px; display: flex; flex-direction: column; gap: 12px; }
.center { flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }

/* cards / pedals */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.card.off .ctrl { opacity: 0.4; }
.card-head { display: flex; align-items: center; gap: 10px; }
.card-title { flex: 1; font-size: 13px; font-weight: 700; letter-spacing: 0.05em; }
.card-sub { font-size: 12px; color: var(--text-3); }
.sw { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; background: var(--c); box-shadow: 0 0 10px var(--c); }
.toggle { width: 44px; height: 26px; padding: 3px; border: 0; border-radius: 999px; background: var(--control-line); display: flex; justify-content: flex-start; flex-shrink: 0; transition: background .15s; }
.toggle span { width: 20px; height: 20px; border-radius: 50%; background: var(--ink); }
.toggle[aria-pressed="true"] { background: var(--cream); justify-content: flex-end; }
.ctrl { display: flex; flex-direction: column; gap: 8px; }
.ctrl-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-2); }
.ctrl-row output { color: var(--text-3); font-variant-numeric: tabular-nums; }
.seg-label { font-size: 12px; color: var(--text-3); }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 40px; border: 0; border-radius: 10px; background: var(--control); color: var(--text-2); font-size: 12px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--cream); color: var(--ink); font-weight: 600; }

input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 20px; margin: 0; background: transparent; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; background: var(--control-line); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 5px; background: #FFFFFF; margin-top: -6px; }
input[type=range]::-moz-range-track { height: 4px; background: var(--control-line); border-radius: 2px; }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 5px; border: 0; background: #FFFFFF; }

/* visual */
.visual { margin: 0; position: relative; height: 650px; border-radius: 24px; overflow: hidden; background: #05070A; border: 1px solid var(--line); }
.visual svg.aurora { position: absolute; inset: 0; width: 100%; height: 100%; transition: filter .12s; }
.visual-ui { position: absolute; inset: 0; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; }
.visual-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.tempo { display: flex; flex-direction: column; }
.tempo b { font-size: 96px; font-weight: 700; line-height: 0.9; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.tempo span { font-size: 13px; font-weight: 600; letter-spacing: 0.1em; color: var(--text-2); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.35); background: rgba(11,13,16,0.55); color: var(--text); font-size: 12px; font-weight: 600; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.chip[aria-pressed="true"] { background: var(--cream); border-color: var(--cream); color: var(--ink); }
.glass-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; max-width: 560px; }
.pad-col { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
.pad-name { font-size: 12px; font-weight: 600; color: var(--text-2); white-space: nowrap; }
.pad-sub { font-size: 11px; color: rgba(255,255,255,0.85); }
.glass .pad-name, .glass .pad-sub { color: #FFFFFF; text-shadow: 0 1px 6px rgba(0,0,0,0.6); }
.glass .pad-name { font-size: 13px; font-weight: 700; }
.pad { position: relative; width: 100%; aspect-ratio: 1; border: 1px solid var(--control-line); background: var(--control); border-radius: 14px; transition: background .08s, box-shadow .08s, transform .08s; }
.pad.round { border-radius: 50%; }
.pad kbd { position: absolute; right: 6px; bottom: 4px; font: 600 10px 'Onest', sans-serif; color: var(--text-3); }
.glass .pad { max-width: 72px; border-radius: 18px; border: 1.5px solid rgba(255,255,255,0.45); background: rgba(255,255,255,0.12); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.glass .pad kbd { color: rgba(255,255,255,0.8); }
.pad.hit { background: var(--c); border-color: var(--c); box-shadow: 0 0 24px var(--c); transform: scale(0.96); }
.pad.hit kbd { color: var(--ink); }
.pads-row { display: flex; flex-wrap: wrap; gap: 20px; }
.pads-row .card { padding: 18px; }
.grid { display: grid; gap: 10px; }
.drums-card { flex: 1.5 1 380px; }
.bass-card { flex: 1 1 280px; }
.drums-card .pad, .bass-card .pad { max-width: 56px; }
.legend { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; }
.legend span { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
.legend .sw { width: 10px; height: 10px; }
.hint { font-size: 12px; color: var(--text-3); text-align: center; margin: 0; }

.start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 10; padding: 24px; }
.start[hidden] { display: none; }
.start button { min-height: 56px; padding: 0 28px; border: 0; border-radius: 999px; background: var(--cream); color: var(--ink); font-size: 16px; font-weight: 700; }

@media (max-width: 640px) {
  .device { padding: 18px; border-radius: 22px; }
  .visual { height: 520px; }
  .tempo b { font-size: 64px; }
  .glass-grid { gap: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .pad, .visual svg.aurora { transition: none; }
}
</style>
</head>
<body>
<div class="start" id="start">
  <button id="startBtn">Включить звук</button>
</div>

<div class="page">
<div class="device">
<header>
  <div class="corner">
    <span class="corner-title">ТЕМП <span id="bpmLabel">130</span></span>
    <div class="corner-row">
      <button class="step" data-step="bpm" data-dir="-1" aria-label="Медленнее">−</button>
      <label><span hidden>Темп</span><input id="bpm" type="range" min="80" max="180" value="130" aria-label="Темп"></label>
      <button class="step" data-step="bpm" data-dir="1" aria-label="Быстрее">+</button>
    </div>
  </div>
  <div class="brand">
    <h1 class="logo">ап/синт</h1>
    <div class="key">
      <button class="step" id="keyPrev" aria-label="Предыдущая тональность">‹</button>
      <span class="key-name" id="keyName" aria-live="polite">C# минор</span>
      <button class="step" id="keyNext" aria-label="Следующая тональность">›</button>
    </div>
  </div>
  <div class="corner right">
    <span class="corner-title">ГРОМКОСТЬ <span id="volLabel">80</span></span>
    <div class="corner-row">
      <button class="step" data-step="vol" data-dir="-1" aria-label="Тише">−</button>
      <label><span hidden>Громкость</span><input id="vol" type="range" min="0" max="100" value="80" aria-label="Громкость"></label>
      <button class="step" data-step="vol" data-dir="1" aria-label="Громче">+</button>
    </div>
  </div>
</header>

<div class="body">
  <div class="side">
    <section class="card" data-fx="cowDist" style="--c: var(--cow)" aria-label="Дисторшн ковбелла">
      <div class="card-head"><span class="sw"></span><span class="card-title">ДИСТОРШН</span><button class="toggle" aria-pressed="true" aria-label="Включить дисторшн ковбелла"><span></span></button></div>
      <label class="ctrl"><span class="ctrl-row"><span>Микс</span><output></output></span><input type="range" data-p="cowDist.wet" value="60"></label>
      <label class="ctrl"><span class="ctrl-row"><span>Драйв</span><output></output></span><input type="range" data-p="cowDist.drive" value="40"></label>
      <div class="ctrl" role="group" aria-label="Оверсемплинг"><span class="seg-label">Оверсемплинг</span>
        <div class="seg" data-seg="cowDist.os"><button aria-pressed="false" data-v="none">Нет</button><button aria-pressed="true" data-v="2x">2x</button><button aria-pressed="false" data-v="4x">4x</button></div></div>
    </section>
    <section class="card" data-fx="cowRev" style="--c: var(--cow)" aria-label="Ревёрб ковбелла">
      <div class="card-head"><span class="sw"></span><span class="card-title">РЕВЁРБ</span><button class="toggle" aria-pressed="true" aria-label="Включить ревёрб ковбелла"><span></span></button></div>
      <label class="ctrl"><span class="ctrl-row"><span>Микс</span><output></output></span><input type="range" data-p="cowRev.wet" value="35"></label>
      <label class="ctrl"><span class="ctrl-row"><span>Затухание</span><output></output></span><input type="range" data-p="cowRev.decay" value="35"></label>
      <label class="ctrl"><span class="ctrl-row"><span>Пре-дилей</span><output></output></span><input type="range" data-p="cowRev.pre" value="20"></label>
    </section>
    <section class="card off" data-fx="crush" style="--c: var(--drums)" aria-label="Биткрашер ударных">
      <div class="card-head"><span class="sw"></span><span class="card-title">БИТКРАШЕР</span><button class="toggle" aria-pressed="false" aria-label="Включить биткрашер ударных"><span></span></button></div>
      <label class="ctrl"><span class="ctrl-row"><span>Микс</span><output></output></span><input type="range" data-p="crush.wet" value="60"></label>
      <label class="ctrl"><span class="ctrl-row"><span>Биты</span><output></output></span><input type="range" data-p="crush.bits" value="35"></label>
    </section>
    <section class="card" data-fx="drumRev" style="--c: var(--drums)" aria-label="Ревёрб ударных">
      <div class="card-head"><span class="sw"></span><span class="card-title">РЕВЁРБ</span><button class="toggle" aria-pressed="true" aria-label="Включить ревёрб ударных"><span></span></button></div>
      <label class="ctrl"><span class="ctrl-row"><span>Микс</span><output></output></span><input type="range" data-p="drumRev.wet" value="15"></label>
      <label class="ctrl"><span class="ctrl-row"><span>Затухание</span><output></output></span><input type="range" data-p="drumRev.decay" value="15"></label>
    </section>
  </div>

  <div class="center">
    <figure class="visual" aria-label="Визуал реагирует на громкость">
      <svg class="aurora" id="aurora" viewBox="0 0 1500 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="bands" x1="0" y1="0" x2="1" y2="0.15">
            <stop offset="0" stop-color="#05070A"></stop><stop offset="0.18" stop-color="#0B1B5A"></stop>
            <stop offset="0.28" stop-color="#39FF14"></stop><stop offset="0.35" stop-color="#B6FF3B"></stop>
            <stop offset="0.43" stop-color="#2FE6E6"></stop><stop offset="0.52" stop-color="#5B2BFF"></stop>
            <stop offset="0.6" stop-color="#FF2BD6"></stop><stop offset="0.68" stop-color="#6A2BFF"></stop>
            <stop offset="0.77" stop-color="#39FF14"></stop><stop offset="0.86" stop-color="#2FE6E6"></stop>
            <stop offset="0.93" stop-color="#FF2BD6"></stop><stop offset="1" stop-color="#5B2BFF"></stop>
          </linearGradient>
          <filter id="melt" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.0035 0.011" numOctaves="2" seed="11" result="noise"></feTurbulence>
            <feDisplacementMap id="disp" in="SourceGraphic" in2="noise" scale="420" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
          </filter>
          <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#05070A" stop-opacity="1"></stop><stop offset="0.3" stop-color="#05070A" stop-opacity="0.85"></stop><stop offset="0.5" stop-color="#05070A" stop-opacity="0"></stop>
          </linearGradient>
        </defs>
        <rect width="1500" height="800" fill="#05070A"></rect>
        <rect id="bandsRect" x="-300" y="-300" width="2100" height="1400" fill="url(#bands)" filter="url(#melt)"></rect>
        <rect width="1500" height="800" fill="url(#fade)"></rect>
        <g id="stars" fill="#FFFFFF" opacity="0.55">
          <circle cx="90" cy="120" r="1.4"></circle><circle cx="210" cy="260" r="1"></circle><circle cx="140" cy="420" r="1.6"></circle><circle cx="330" cy="150" r="1"></circle>
          <circle cx="420" cy="380" r="1.3"></circle><circle cx="260" cy="560" r="1"></circle><circle cx="60" cy="640" r="1.2"></circle><circle cx="500" cy="90" r="1"></circle>
          <circle cx="380" cy="690" r="1.4"></circle><circle cx="560" cy="250" r="1"></circle>
        </g>
        <g id="curve">
          <path d="M600 210 C 470 300, 470 560, 620 650 S 900 760, 1060 700" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round" fill="none" opacity="0.8"></path>
          <path d="M130 720 C 420 560, 640 470, 790 330 S 1020 30, 1150 60 S 1360 420, 1500 780" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round"></path>
          <circle cx="130" cy="720" r="10" fill="#FFFFFF"></circle><circle cx="790" cy="330" r="9" fill="#FFFFFF"></circle><circle cx="1150" cy="60" r="9" fill="#FFFFFF"></circle>
        </g>
      </svg>
      <div class="visual-ui">
        <div class="visual-top">
          <div class="tempo"><b id="bpmBig">130</b><span>BPM</span></div>
          <div class="chips" role="group" aria-label="Слои визуала">
            <button class="chip" data-layer="bandsRect" aria-pressed="true">Аврора</button>
            <button class="chip" data-layer="curve" aria-pressed="true">Кривая</button>
            <button class="chip" data-layer="stars" aria-pressed="true">Звёзды</button>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 12px">
          <div class="card-head" style="--c: var(--cow)"><span class="sw"></span><span class="card-title" style="flex: none">КОВБЕЛЛ</span><span class="card-sub" style="color: var(--text-2)">минорная пентатоника</span></div>
          <div class="glass-grid glass" id="cowPads" style="--c: var(--cow)"></div>
        </div>
      </div>
    </figure>

    <div class="pads-row">
      <section class="card drums-card" style="--c: var(--drums)" aria-label="Пэды ударных">
        <div class="card-head"><span class="sw"></span><span class="card-title" style="flex: none">УДАРНЫЕ</span></div>
        <div class="grid" id="drumPads" style="grid-template-columns: repeat(6, minmax(0, 1fr))"></div>
      </section>
      <section class="card bass-card" style="--c: var(--b808)" aria-label="Пэды 808">
        <div class="card-head"><span class="sw"></span><span class="card-title" style="flex: none">808</span><span class="card-sub">бас</span></div>
        <div class="grid" id="bassPads" style="grid-template-columns: repeat(4, minmax(0, 1fr))"></div>
      </section>
    </div>
    <div class="legend">
      <span style="--c: var(--cow)"><i class="sw"></i>Ковбелл</span>
      <span style="--c: var(--drums)"><i class="sw"></i>Ударные</span>
      <span style="--c: var(--b808)"><i class="sw"></i>808</span>
      <span style="--c: var(--master)"><i class="sw"></i>Мастер</span>
    </div>
    <p class="hint">Играй мышкой или с клавиатуры: буквы в углу пэдов.</p>
  </div>

  <div class="side">
    <section class="card" data-fx="bassDist" style="--c: var(--b808)" aria-label="Дисторшн 808">
      <div class="card-head"><span class="sw"></span><span class="card-title">ДИСТОРШН</span><button class="toggle" aria-pressed="true" aria-label="Включить дисторшн 808"><span></span></button></div>
      <label class="ctrl"><span class="ctrl-row"><span>Микс</span><output></output></span><input type="range" data-p="bassDist.wet" value="70"></label>
      <label class="ctrl"><span class="ctrl-row"><span>Драйв</span><output></output></span><input type="range" data-p="bassDist.drive" value="55"></label>
      <div class="ctrl" role="group" aria-label="Оверсемплинг"><span class="seg-label">Оверсемплинг</span>
        <div class="seg" data-seg="bassDist.os"><button aria-pressed="false" data-v="none">Нет</button><button aria-pressed="false" data-v="2x">2x</button><button aria-pressed="true" data-v="4x">4x</button></div></div>
    </section>
    <section class="card" data-fx="bassFilter" style="--c: var(--b808)" aria-label="Фильтр 808">
      <div class="card-head"><span class="sw"></span><span class="card-title">ФИЛЬТР</span><button class="toggle" aria-pressed="true" aria-label="Включить фильтр 808"><span></span></button></div>
      <label class="ctrl"><span class="ctrl-row"><span>Срез</span><output></output></span><input type="range" data-p="bassFilter.cutoff" value="65"></label>
      <label class="ctrl"><span class="ctrl-row"><span>Глайд</span><output></output></span><input type="range" data-p="bassFilter.glide" value="40"></label>
      <div class="ctrl" role="group" aria-label="Тип фильтра"><span class="seg-label">Тип</span>
        <div class="seg" data-seg="bassFilter.type"><button aria-pressed="true" data-v="lowpass">НЧ</button><button aria-pressed="false" data-v="highpass">ВЧ</button><button aria-pressed="false" data-v="bandpass">ПФ</button></div></div>
    </section>
    <section class="card" data-fx="comp" style="--c: var(--master)" aria-label="Компрессор мастера">
      <div class="card-head"><span class="sw"></span><span class="card-title">КОМПРЕССОР</span><button class="toggle" aria-pressed="true" aria-label="Включить компрессор"><span></span></button></div>
      <label class="ctrl"><span class="ctrl-row"><span>Порог</span><output></output></span><input type="range" data-p="comp.threshold" value="55"></label>
      <label class="ctrl"><span class="ctrl-row"><span>Соотношение</span><output></output></span><input type="range" data-p="comp.ratio" value="16"></label>
    </section>
    <section class="card" data-fx="limiter" style="--c: var(--master)" aria-label="Лимитер мастера">
      <div class="card-head"><span class="sw"></span><span class="card-title">ЛИМИТЕР</span><button class="toggle" aria-pressed="true" aria-label="Включить лимитер"><span></span></button></div>
      <label class="ctrl"><span class="ctrl-row"><span>Потолок</span><output></output></span><input type="range" data-p="limiter.ceiling" value="97"></label>
    </section>
  </div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
<script>
(() => {
  const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const COW_DEG = [0, 3, 5, 7, 10, 12];
  const COW_LBL = ['1', 'b3', '4', '5', 'b7', '8'];
  const COW_KEYS = ['a','s','d','f','g','h'];
  const DRUMS = [['kick','Kick','q'],['clap','Clap','w'],['hat','Хэт','e'],['ohat','Откр.','r'],['roll','Ролл','t'],['impact','Impact','y']];
  const BASS = [['root','Тоника','z',0],['fifth','Квинта','x',7],['oct','Октава','c',12],['glide','Глайд','v',0]];

  const state = { bpm: 130, vol: 80, key: 1, glide: 0.25 };
  const midiToHz = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const pct = (el) => Number(el.value) / 100;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

  /* ---------- pads ---------- */
  function padCol(name, sub, key, cls, id) {
    const col = document.createElement('div');
    col.className = 'pad-col';
    col.innerHTML = `<span class="pad-name">${name}</span><button class="pad ${cls}" data-id="${id}" aria-label="${name}"><kbd>${key.toUpperCase()}</kbd></button>` + (sub ? `<span class="pad-sub">${sub}</span>` : '');
    return col;
  }
  function renderCowPads() {
    const box = $('#cowPads'); box.innerHTML = '';
    COW_DEG.forEach((d, i) => box.appendChild(padCol(NOTES[(state.key + d) % 12], COW_LBL[i], COW_KEYS[i], '', 'cow' + i)));
  }
  renderCowPads();
  DRUMS.forEach(([id, n, k]) => $('#drumPads').appendChild(padCol(n, '', k, 'round', id)));
  BASS.forEach(([id, n, k]) => $('#bassPads').appendChild(padCol(n, '', k, '', 'b_' + id)));

  const keyMap = {};
  COW_KEYS.forEach((k, i) => keyMap[k] = 'cow' + i);
  DRUMS.forEach(([id, , k]) => keyMap[k] = id);
  BASS.forEach(([id, , k]) => keyMap[k] = 'b_' + id);

  function flash(id) {
    const el = $(`.pad[data-id="${id}"]`);
    if (!el) return;
    el.classList.add('hit');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('hit'), 140);
  }

  /* ---------- audio ---------- */
  let A = null;
  function crushCurve(bits) {
    const steps = Math.pow(2, bits);
    const n = 4096, c = new Float32Array(n);
    for (let i = 0; i < n; i++) { const x = (i / (n - 1)) * 2 - 1; c[i] = Math.round(x * steps / 2) / (steps / 2); }
    return c;
  }

  async function initAudio() {
    if (A) return A;
    await Tone.start();
    Tone.context.lookAhead = 0.01;
    const master = new Tone.Volume(Tone.gainToDb(state.vol / 100)).toDestination();
    const meter = new Tone.Meter({ normalRange: true, smoothing: 0.8 });
    master.connect(meter);
    const limiter = new Tone.Limiter(-0.3).connect(master);
    const comp = new Tone.Compressor({ threshold: -18, ratio: 4, attack: 0.005, release: 0.15 }).connect(limiter);

    // cowbell bus
    const cowRev = new Tone.Reverb({ decay: 2.5, preDelay: 0.02, wet: 0.35 }).connect(comp);
    const cowDist = new Tone.Distortion({ distortion: 0.4, wet: 0.6, oversample: '2x' }).connect(cowRev);
    const cowIn = new Tone.Gain(0.55).connect(cowDist);

    // 808 bus
    const bassFilter = new Tone.Filter({ frequency: 1200, type: 'lowpass', rolloff: -24 }).connect(comp);
    const bassDist = new Tone.Distortion({ distortion: 0.55, wet: 0.7, oversample: '4x' }).connect(bassFilter);
    const bass = new Tone.MembraneSynth({ pitchDecay: 0.03, octaves: 1.5, oscillator: { type: 'sine' }, envelope: { attack: 0.003, decay: 1.4, sustain: 0, release: 0.1 }, volume: -3 }).connect(bassDist);
    const glide = new Tone.Synth({ oscillator: { type: 'sine' }, envelope: { attack: 0.003, decay: 1.4, sustain: 0, release: 0.1 }, volume: -3 }).connect(bassDist);

    // drums bus
    const drumRev = new Tone.Reverb({ decay: 1.2, wet: 0.15 }).connect(comp);
    const crushMix = new Tone.CrossFade(0).connect(drumRev);
    const crusher = new Tone.WaveShaper(crushCurve(6)).connect(crushMix.b);
    const drumIn = new Tone.Gain(1);
    drumIn.connect(crushMix.a); drumIn.connect(crusher);
    const kick = new Tone.MembraneSynth({ pitchDecay: 0.06, octaves: 6, envelope: { attack: 0.001, decay: 0.45, sustain: 0, release: 0.05 }, volume: -2 }).connect(drumIn);
    const clapBp = new Tone.Filter({ frequency: 1300, type: 'bandpass', Q: 1.2 }).connect(drumIn);
    const clap = new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.001, decay: 0.14, sustain: 0 }, volume: -4 }).connect(clapBp);
    const hatHp = new Tone.Filter({ frequency: 7000, type: 'highpass' }).connect(drumIn);
    const hat = new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.001, decay: 0.05, sustain: 0 }, volume: -10 }).connect(hatHp);
    const ohat = new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.001, decay: 0.45, sustain: 0, release: 0.03 }, volume: -12 }).connect(hatHp);
    const impRev = new Tone.Reverb({ decay: 4, wet: 0.65 }).connect(comp);
    const impNoise = new Tone.NoiseSynth({ noise: { type: 'pink' }, envelope: { attack: 0.005, decay: 1.6, sustain: 0 }, volume: -8 }).connect(impRev);
    const impBoom = new Tone.MembraneSynth({ pitchDecay: 0.2, octaves: 4, envelope: { attack: 0.001, decay: 1.5, sustain: 0 }, volume: -2 }).connect(impRev);

    A = { master, meter, limiter, comp, cowRev, cowDist, cowIn, bassFilter, bassDist, bass, glide, drumRev, crushMix, crusher, kick, clap, hat, ohat, impNoise, impBoom };
    applyAll();
    return A;
  }

  function cowbell(freq, t) {
    const env = new Tone.AmplitudeEnvelope({ attack: 0.001, decay: 0.32, sustain: 0, release: 0.02 }).connect(A.cowIn);
    const bp = new Tone.Filter({ frequency: freq * 1.45, type: 'bandpass', Q: 0.9 }).connect(env);
    const o1 = new Tone.Oscillator(freq, 'square').connect(bp);
    const o2 = new Tone.Oscillator(freq * 1.48, 'square').connect(bp);
    o1.volume.value = -8; o2.volume.value = -8;
    o1.start(t); o2.start(t); env.triggerAttackRelease(0.32, t);
    o1.stop(t + 0.6); o2.stop(t + 0.6);
    setTimeout(() => [o1, o2, bp, env].forEach((n) => n.dispose()), 1500);
  }

  let lastNoise = 0;
  const after = (t) => { const s = Math.max(t, lastNoise + 0.005); lastNoise = s; return s; };

  async function play(id) {
    await initAudio();
    const t = Tone.now() + 0.005;
    flash(id);
    if (id.startsWith('cow')) {
      const i = Number(id.slice(3));
      cowbell(midiToHz(72 + state.key + COW_DEG[i]), t);
      return;
    }
    const bassRoot = 36 + state.key;
    switch (id) {
      case 'b_root': A.bass.triggerAttackRelease(midiToHz(bassRoot), 1.4, t); break;
      case 'b_fifth': A.bass.triggerAttackRelease(midiToHz(bassRoot + 7), 1.4, t); break;
      case 'b_oct': A.bass.triggerAttackRelease(midiToHz(bassRoot + 12), 1.4, t); break;
      case 'b_glide': {
        const hi = midiToHz(bassRoot + 12), lo = midiToHz(bassRoot);
        A.glide.triggerAttackRelease(hi, 1.4, t);
        A.glide.frequency.setValueAtTime(hi, t + 0.01);
        A.glide.frequency.exponentialRampToValueAtTime(lo, t + 0.01 + state.glide);
        break;
      }
      case 'kick': A.kick.triggerAttackRelease('C1', 0.4, t); break;
      case 'clap': for (let k = 0; k < 3; k++) A.clap.triggerAttackRelease(0.14, after(t + k * 0.011)); break;
      case 'hat': A.ohat.triggerRelease(t); A.hat.triggerAttackRelease(0.05, after(t)); break;
      case 'ohat': A.ohat.triggerAttackRelease(0.45, after(t)); break;
      case 'roll': {
        const step = 60 / state.bpm / 6;
        for (let k = 0; k < 6; k++) A.hat.triggerAttackRelease(0.04, after(t + k * step));
        break;
      }
      case 'impact': A.impBoom.triggerAttackRelease('C1', 1.2, t); A.impNoise.triggerAttackRelease(1.6, after(t)); break;
    }
  }

  /* ---------- controls ---------- */
  const fxOn = {};
  $$('[data-fx]').forEach((c) => fxOn[c.dataset.fx] = $('.toggle', c).getAttribute('aria-pressed') === 'true');
  const val = (p) => pct($(`[data-p="${p}"]`));
  const seg = (s) => $(`[data-seg="${s}"] [aria-pressed="true"]`).dataset.v;

  const MAP = {
    'cowDist.wet': (v) => `${Math.round(v * 100)}%`,
    'cowDist.drive': (v) => `${Math.round(v * 100)}%`,
    'cowRev.wet': (v) => `${Math.round(v * 100)}%`,
    'cowRev.decay': (v) => `${(0.5 + v * 5.5).toFixed(1)} с`,
    'cowRev.pre': (v) => `${Math.round(v * 100)} мс`,
    'crush.wet': (v) => `${Math.round(v * 100)}%`,
    'crush.bits': (v) => `${Math.round(2 + v * 10)} бит`,
    'drumRev.wet': (v) => `${Math.round(v * 100)}%`,
    'drumRev.decay': (v) => `${(0.5 + v * 4.5).toFixed(1)} с`,
    'bassDist.wet': (v) => `${Math.round(v * 100)}%`,
    'bassDist.drive': (v) => `${Math.round(v * 100)}%`,
    'bassFilter.cutoff': (v) => { const f = 80 * Math.pow(100, v); return f >= 1000 ? `${(f / 1000).toFixed(1)} кГц` : `${Math.round(f)} Гц`; },
    'bassFilter.glide': (v) => `${Math.round(20 + v * 580)} мс`,
    'comp.threshold': (v) => `${Math.round(-40 + v * 40)} дБ`,
    'comp.ratio': (v) => `${Math.round(1 + v * 19)}:1`,
    'limiter.ceiling': (v) => `${(-12 + v * 12).toFixed(1)} дБ`,
  };
  function updateOutputs() {
    $$('[data-p]').forEach((inp) => { const o = inp.closest('.ctrl').querySelector('output'); if (o) o.textContent = MAP[inp.dataset.p](pct(inp)); });
  }

  let revTimer = null;
  function applyAll() {
    updateOutputs();
    state.glide = (20 + val('bassFilter.glide') * 580) / 1000;
    if (!A) return;
    A.cowDist.wet.value = fxOn.cowDist ? val('cowDist.wet') : 0;
    A.cowDist.distortion = val('cowDist.drive');
    A.cowDist.oversample = seg('cowDist.os');
    A.cowRev.wet.value = fxOn.cowRev ? val('cowRev.wet') : 0;
    A.crushMix.fade.value = fxOn.crush ? val('crush.wet') : 0;
    A.drumRev.wet.value = fxOn.drumRev ? val('drumRev.wet') : 0;
    A.bassDist.wet.value = fxOn.bassDist ? val('bassDist.wet') : 0;
    A.bassDist.distortion = val('bassDist.drive');
    A.bassDist.oversample = seg('bassDist.os');
    A.bassFilter.type = fxOn.bassFilter ? seg('bassFilter.type') : 'lowpass';
    A.bassFilter.frequency.rampTo(fxOn.bassFilter ? 80 * Math.pow(100, val('bassFilter.cutoff')) : 20000, 0.05);
    A.comp.threshold.value = fxOn.comp ? -40 + val('comp.threshold') * 40 : 0;
    A.comp.ratio.value = fxOn.comp ? 1 + val('comp.ratio') * 19 : 1;
    A.limiter.threshold.value = fxOn.limiter ? -12 + val('limiter.ceiling') * 12 : 0;
    A.master.volume.rampTo(state.vol === 0 ? -Infinity : Tone.gainToDb(state.vol / 100), 0.05);
    // regenerating reverbs is costly, so debounce it
    clearTimeout(revTimer);
    revTimer = setTimeout(() => {
      const cd = 0.5 + val('cowRev.decay') * 5.5, cp = val('cowRev.pre') * 0.1, dd = 0.5 + val('drumRev.decay') * 4.5;
      if (Math.abs(A.cowRev.decay - cd) > 0.05) A.cowRev.decay = cd;
      if (Math.abs(A.cowRev.preDelay - cp) > 0.002) A.cowRev.preDelay = cp;
      if (Math.abs(A.drumRev.decay - dd) > 0.05) A.drumRev.decay = dd;
      const bits = Math.round(2 + val('crush.bits') * 10);
      if (A.crusher._bits !== bits) { A.crusher.curve = crushCurve(bits); A.crusher._bits = bits; }
    }, 200);
  }

  $$('[data-p]').forEach((inp) => inp.addEventListener('input', applyAll));
  $$('[data-seg]').forEach((g) => g.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    $$('button', g).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    applyAll();
  }));
  $$('[data-fx]').forEach((card) => $('.toggle', card).addEventListener('click', (e) => {
    const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
    e.currentTarget.setAttribute('aria-pressed', String(on));
    card.classList.toggle('off', !on);
    fxOn[card.dataset.fx] = on;
    applyAll();
  }));

  function setBpm(v) {
    state.bpm = Math.max(80, Math.min(180, v));
    $('#bpm').value = state.bpm; $('#bpmLabel').textContent = state.bpm; $('#bpmBig').textContent = state.bpm;
  }
  function setVol(v) {
    state.vol = Math.max(0, Math.min(100, v));
    $('#vol').value = state.vol; $('#volLabel').textContent = state.vol;
    applyAll();
  }
  $('#bpm').addEventListener('input', (e) => setBpm(Number(e.target.value)));
  $('#vol').addEventListener('input', (e) => setVol(Number(e.target.value)));
  $$('[data-step]').forEach((b) => b.addEventListener('click', () => {
    const d = Number(b.dataset.dir);
    if (b.dataset.step === 'bpm') setBpm(state.bpm + d); else setVol(state.vol + d * 5);
  }));
  function setKey(k) { state.key = (k + 12) % 12; $('#keyName').textContent = `${NOTES[state.key]} минор`; renderCowPads(); }
  $('#keyPrev').addEventListener('click', () => setKey(state.key - 1));
  $('#keyNext').addEventListener('click', () => setKey(state.key + 1));

  $$('.chip').forEach((c) => c.addEventListener('click', () => {
    const on = c.getAttribute('aria-pressed') !== 'true';
    c.setAttribute('aria-pressed', String(on));
    document.getElementById(c.dataset.layer).style.display = on ? '' : 'none';
  }));

  document.addEventListener('pointerdown', (e) => {
    const pad = e.target.closest('.pad');
    if (pad) { e.preventDefault(); play(pad.dataset.id); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.matches('input')) return;
    const id = keyMap[e.key.toLowerCase()];
    if (id) { e.preventDefault(); play(id); return; }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.pad')) { e.preventDefault(); play(e.target.closest('.pad').dataset.id); }
  });

  $('#startBtn').addEventListener('click', async () => { await initAudio(); $('#start').hidden = true; });

  /* ---------- aurora reacts to level ---------- */
  const disp = $('#disp'), turb = $('#turb'), svg = $('#aurora');
  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let lvl = 0, frame = 0;
  function tick(ts) {
    requestAnimationFrame(tick);
    if (!A || still) return;
    if (++frame % 2) return;
    const m = A.meter.getValue();
    const raw = Array.isArray(m) ? Math.max(...m) : m;
    lvl += (Math.min(1, raw * 2.2) - lvl) * 0.35;
    disp.setAttribute('scale', (380 + lvl * 360).toFixed(0));
    const fx = 0.0035 + Math.sin(ts / 4000) * 0.0005;
    turb.setAttribute('baseFrequency', `${fx.toFixed(5)} 0.011`);
    svg.style.filter = `brightness(${(1 + lvl * 0.6).toFixed(2)}) saturate(${(1 + lvl * 0.5).toFixed(2)})`;
  }
  requestAnimationFrame(tick);

  setBpm(130); updateOutputs();
})();
</script>
</body>
</html>
